[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "BUSL-1.1",
  "MIT",
  "Unicode-3.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
  { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
# Kept at "warn" rather than "deny": the only duplicate versions in the graph
# (getrandom 0.3/0.4, memchr, serde_core) are pulled in transitively by
# dev/bench tooling (proptest, criterion, tempfile, rusty-fork) and do not
# affect the shipped binary. Promote to "deny" once `cargo tree -d` is clean.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
