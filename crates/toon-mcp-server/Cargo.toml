[package]
name        = "toon-mcp-server"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
description = "MCP server binary for TOON-format compression of structured data"
keywords    = ["toon", "mcp", "compression", "llm", "server"]
categories  = ["command-line-utilities"]

[[bin]]
name = "toon-mcp-server"
path = "src/main.rs"

[dependencies]
toon-mcp-core    = { path = "../toon-mcp-core" }
toon-mcp-logging = { path = "../toon-mcp-logging" }
rmcp.workspace         = true
serde.workspace        = true
serde_json.workspace   = true
schemars.workspace     = true
tokio.workspace        = true
async-trait.workspace  = true
thiserror.workspace    = true
dotenvy.workspace      = true
tracing.workspace      = true
tracing-subscriber.workspace = true
uuid.workspace         = true
chrono.workspace       = true
toon-format            = { version = "=0.4.5", default-features = false }
