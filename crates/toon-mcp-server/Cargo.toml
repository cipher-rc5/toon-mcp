[package]
name        = "toon-mcp-server"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
description = "MCP server binary for TOON-format compression of structured data"
keywords    = ["toon", "mcp", "compression", "llm", "server"]
categories  = ["command-line-utilities"]

[[bin]]
name = "toon-mcp-server"
path = "src/main.rs"

[lib]
name = "toon_mcp_server"
path = "src/lib.rs"

[dependencies]
toon-mcp-core    = { path = "../toon-mcp-core" }
toon-mcp-logging = { path = "../toon-mcp-logging" }
rmcp.workspace         = true
serde.workspace        = true
serde_json.workspace   = true
schemars.workspace     = true
tokio.workspace        = true
thiserror.workspace    = true
dotenvy.workspace      = true
tracing.workspace      = true
tracing-subscriber.workspace = true
chrono.workspace       = true
toon-format.workspace  = true
xxhash-rust.workspace  = true

[dev-dependencies]
temp-env = "=0.3.6"
rmcp     = { version = "=1.6.0", features = ["server", "transport-io", "macros", "schemars", "client"] }
anyhow   = "=1.0.102"
