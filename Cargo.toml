[workspace]
resolver = "2"
members = [
  "crates/toon-mcp-bench",
  "crates/toon-mcp-core",
  "crates/toon-mcp-logging",
  "crates/toon-mcp-server",
]
# Standalone crates with their own toolchain / build requirements (nightly
# cargo-fuzz instrumentation; the offline eval harness). Excluding them lets
# ad-hoc `cargo` commands run from those directories without the parent
# workspace claiming them.
exclude = [
  "fuzz",
  "evals",
]

[workspace.package]
version = "0.1.0"
authors = ["cipher-rc5"]
categories = ["command-line-utilities", "compression", "encoding"]
documentation = "https://github.com/cipher-rc5/toon-mcp#readme"
edition = "2024"
homepage = "https://github.com/cipher-rc5/toon-mcp"
keywords = ["mcp", "toon", "compression", "llm", "json"]
license = "BUSL-1.1"
readme = "README.md"
repository = "https://github.com/cipher-rc5/toon-mcp"
rust-version = "1.95.0"
description = "MCP server that detects, classifies, and compresses structured data (JSON, JSONL, CSV, TSV) into the TOON format to reduce LLM context token consumption."

[workspace.dependencies]
# MCP
rmcp = { version = "=1.7.0", features = ["server", "transport-io", "macros", "schemars"] }

# TOON
toon-format = { version = "=0.5.0", default-features = false }

# Serialization
schemars = "=1.2.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

# CSV/TSV parsing
csv = "=1.4.0"

# Async
async-trait = "=0.1.89"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

# Benchmarking
criterion = { version = "=0.8.2", features = ["html_reports"] }

# Observability
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Utilities
anyhow = "=1.0.102"
dotenvy = "=0.15.7"
jiff = "=0.2.27"
temp-env = "=0.3.6"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }

# Property-based testing
proptest = "=1.11.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
