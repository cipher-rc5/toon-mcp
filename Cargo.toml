[workspace]
resolver = "2"
members = [
  "crates/toon-mcp-bench",
  "crates/toon-mcp-core",
  "crates/toon-mcp-logging",
  "crates/toon-mcp-server",
]

[workspace.package]
version     = "0.1.0"
edition     = "2024"
license     = "MIT"
repository  = "https://github.com/anomalyco/toon-mcp"
authors     = ["toon-mcp contributors"]

[workspace.dependencies]
# MCP
rmcp = { version = "=1.3.0", features = ["server", "transport-io", "macros", "schemars"] }

# TOON
toon-format = { version = "=0.4.5", default-features = false }

# Serialization
schemars  = "=1.2.1"
serde     = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

# CSV/TSV parsing
csv = "=1.4.0"

# Async
async-trait = "=0.1.89"
tokio = { version = "=1.51.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

# Benchmarking
criterion = { version = "=0.8.2", features = ["html_reports"] }

# Observability
tracing            = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Utilities
chrono   = { version = "=0.4.44", features = ["serde"] }
dotenvy  = "=0.15.7"
tempfile = "=3.27.0"
temp-env = "=0.3.6"
anyhow   = "=1.0.98"
thiserror = "=2.0.18"
uuid     = { version = "=1.23.0", features = ["v4"] }
