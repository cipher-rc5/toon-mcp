[workspace]
resolver = "2"
members = [
  "crates/toon-mcp-bench",
  "crates/toon-mcp-core",
  "crates/toon-mcp-logging",
  "crates/toon-mcp-server",
]

[workspace.package]
version = "0.1.0"
authors = ["cipher-rc5"]
edition = "2024"
license = "MIT"
repository = "https://github.com/cipher-rc5/toon-mcp"

[workspace.dependencies]
# MCP
rmcp = { version = "=1.6.0", features = ["server", "transport-io", "macros", "schemars"] }

# TOON
toon-format = { version = "=0.4.5", default-features = false }

# Serialization
schemars = "=1.2.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

# CSV/TSV parsing
csv = "=1.4.0"

# Async
async-trait = "=0.1.89"
tokio = { version = "=1.52.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

# Benchmarking
criterion = { version = "=0.8.2", features = ["html_reports"] }

# Observability
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Utilities
anyhow = "=1.0.102"
# Default features dropped — we only need `Utc::now()`, microsecond
# timestamps, and `format("%Y-%m-%d")`. Disabling defaults trims
# `iana-time-zone` from the dependency tree.
chrono = { version = "=0.4.44", default-features = false, features = ["serde", "now"] }
dotenvy = "=0.15.7"
temp-env = "=0.3.6"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }

# Property-based testing
proptest = "=1.8.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
