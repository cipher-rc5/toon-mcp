name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Check / Fmt / Clippy / Test / Doc
    # M7: Pinned runner version to prevent silent breakage on image updates.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # M8: Install cargo-llvm-cov for coverage measurement.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      # M8: Measure coverage and enforce a 70% line coverage floor.
      - name: cargo llvm-cov (coverage gate)
        run: |
          cargo llvm-cov --workspace \
            --lcov --output-path lcov.info \
            --ignore-filename-regex "crates/toon-mcp-bench"
          cargo llvm-cov report \
            --ignore-filename-regex "crates/toon-mcp-bench" \
            --fail-under-lines 70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: lcov.info

      - name: cargo doc --no-deps
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: cargo build --release
        run: cargo build --release --package toon-mcp-server
