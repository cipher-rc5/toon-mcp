name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Check / Fmt / Clippy / Test / Doc
    # M7: Pinned runner version to prevent silent breakage on image updates.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy

      # M8: Install cargo-llvm-cov for coverage measurement.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ec1b8a233a7ecec171cd56557f7640e9ae9b24c6  # cargo-llvm-cov

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      # Coverage gate. Floor raised from 70 -> 75 once non-trivial coverage
      # was confirmed; bump again when coverage matures.
      - name: cargo llvm-cov (coverage gate)
        run: |
          cargo llvm-cov --workspace \
            --lcov --output-path lcov.info \
            --ignore-filename-regex "crates/toon-mcp-bench"
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex "crates/toon-mcp-bench"
          cargo llvm-cov report \
            --ignore-filename-regex "crates/toon-mcp-bench" \
            --fail-under-lines 75

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: lcov-report
          path: lcov.info

      - name: cargo doc --no-deps
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: cargo build --release
        run: cargo build --release --package toon-mcp-server

  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8  # v2
        with:
          tool: cargo-audit

      - name: cargo audit (deny warnings)
        run: cargo audit --deny warnings

  semver-checks:
    name: cargo-semver-checks (library crates)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Detect changes to library crates
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "$head" -- \
                 'crates/toon-mcp-core/**' 'crates/toon-mcp-logging/**' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-semver-checks
        if: steps.changes.outputs.run == 'true'
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8  # v2
        with:
          tool: cargo-semver-checks

      - name: cargo semver-checks (toon-mcp-core, toon-mcp-logging)
        if: steps.changes.outputs.run == 'true'
        run: |
          cargo semver-checks check-release \
            -p toon-mcp-core \
            -p toon-mcp-logging
