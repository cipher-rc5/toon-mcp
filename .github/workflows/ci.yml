name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Check / Fmt / Clippy / Test / Doc
    # M7: Pinned runner version to prevent silent breakage on image updates.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Verify toolchain matches rust-toolchain.toml
        run: |
          PINNED=$(awk -F\" '/channel/ { print $2 }' rust-toolchain.toml)
          ACTIVE=$(rustc -V | awk '{ print $2 }')
          if [ "$PINNED" != "$ACTIVE" ]; then
            echo "Toolchain mismatch: rust-toolchain.toml=$PINNED, active=$ACTIVE" >&2
            exit 1
          fi

      # M8: Install cargo-llvm-cov for coverage measurement.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ec1b8a233a7ecec171cd56557f7640e9ae9b24c6 # cargo-llvm-cov

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      # Coverage gate. Floor raised 70 -> 75 -> 85; measured line coverage
      # was 90.9% when the floor moved to 85, leaving ~6 points of headroom.
      - name: cargo llvm-cov (coverage gate)
        run: |
          cargo llvm-cov --workspace \
            --lcov --output-path lcov.info \
            --ignore-filename-regex "crates/toon-mcp-bench"
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex "crates/toon-mcp-bench"
          cargo llvm-cov report \
            --ignore-filename-regex "crates/toon-mcp-bench" \
            --fail-under-lines 85

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-report
          path: lcov.info

      - name: cargo doc --no-deps
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: cargo build --release
        run: cargo build --release --package toon-mcp-server

  evals:
    name: Eval harness (standalone crate)
    # The evals/ harness is its own cargo workspace (not a member of the root
    # workspace), so the main `ci` job never compiles it. Build + lint it here
    # so changes to toon-mcp-core that break the harness are caught.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Install just
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2
        with:
          tool: just

      - name: Cache Cargo registry and eval build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            evals/target
          key: ${{ runner.os }}-cargo-evals-${{ hashFiles('evals/Cargo.toml', 'crates/toon-mcp-core/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-evals-
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check (evals)
        working-directory: evals
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings (evals)
        working-directory: evals
        run: cargo clippy --all-targets -- -D warnings

      - name: just eval-build
        run: just eval-build

      # Round-trip fidelity gate: run the deterministic pipeline subcommand
      # over the committed fixture corpus (no llama-server required) and fail
      # the build if any item drifts through the encode/decode cycle.
      - name: Round-trip fidelity gate (fixture corpus)
        run: |
          mkdir -p evals/results
          cp evals/fixtures/corpus.jsonl evals/results/corpus.jsonl
          just eval-pipeline
          just eval-report
          failures=$(jq '.roundtrip_failures' evals/results/summary.json)
          echo "roundtrip_failures=$failures"
          test "$failures" -eq 0

  windows-check:
    name: Windows cargo check
    # Compiles the #[cfg(not(unix))] shutdown branch on every PR so the
    # non-Unix code path cannot silently rot.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: cargo check --workspace
        run: cargo check --workspace

  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2
        with:
          tool: cargo-audit

      - name: cargo audit (deny warnings)
        run: cargo audit --deny warnings

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources

  fuzz-smoke-pr:
    name: Fuzz smoke (PR — 15s/target)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install nightly toolchain for cargo-fuzz
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2
        with:
          tool: cargo-fuzz

      # The committed seed corpus lives in fuzz/corpus/<target>/; the cache
      # layers each run's discoveries on top so coverage accumulates between
      # runs instead of restarting from the seeds.
      - name: Cache fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Run bounded fuzz smoke targets (PR budget)
        working-directory: fuzz
        run: |
          mkdir -p artifacts
          for target in detect_and_parse json_parse jsonl_parse csv_parse; do
            cargo +nightly fuzz run "$target" -- \
              -max_total_time=15 \
              -rss_limit_mb=512 \
              -artifact_prefix="artifacts/$target-"
          done

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-pr
          path: fuzz/artifacts

  fuzz-smoke-extended:
    name: Fuzz smoke (extended — 300s/target)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      # Required to commit the minimised corpus back to the repository.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install nightly toolchain for cargo-fuzz
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2
        with:
          tool: cargo-fuzz

      - name: Cache fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Run bounded fuzz smoke targets (extended)
        working-directory: fuzz
        run: |
          mkdir -p artifacts
          for target in detect_and_parse json_parse jsonl_parse csv_parse; do
            cargo +nightly fuzz run "$target" -- \
              -max_total_time=300 \
              -rss_limit_mb=512 \
              -artifact_prefix="artifacts/$target-"
          done

      # Minimise the grown corpus and commit it back so coverage accumulates
      # in the repository instead of resetting each run.
      - name: Minimise corpus (cargo fuzz cmin)
        working-directory: fuzz
        run: |
          for target in detect_and_parse json_parse jsonl_parse csv_parse; do
            cargo +nightly fuzz cmin "$target"
          done

      - name: Commit minimised corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuzz/corpus
          if git diff --cached --quiet; then
            echo "corpus unchanged; nothing to commit"
          else
            git commit -m "chore(fuzz): update minimised corpus from scheduled run"
            git push origin "HEAD:${GITHUB_REF_NAME:-master}"
          fi

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-extended
          path: fuzz/artifacts

  semver-checks:
    name: cargo-semver-checks (library crates)
    runs-on: ubuntu-24.04
    # Non-blocking: `cargo semver-checks check-release` baselines against the
    # crates.io-published version, but toon-mcp-core / toon-mcp-logging are
    # unpublished internal workspace crates ("not found in registry"). The job
    # still runs and surfaces API-break info, but cannot gate CI until these
    # crates are published (or migrated to a git-rev baseline).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Detect changes to library crates
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "$head" -- \
                 'crates/toon-mcp-core/**' 'crates/toon-mcp-logging/**' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-semver-checks
        if: steps.changes.outputs.run == 'true'
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2
        with:
          tool: cargo-semver-checks

      - name: cargo semver-checks (toon-mcp-core, toon-mcp-logging)
        if: steps.changes.outputs.run == 'true'
        run: |
          cargo semver-checks check-release \
            -p toon-mcp-core \
            -p toon-mcp-logging
