name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain pinned via rust-toolchain.toml (1.87.0). Keeping this in
      # sync with CI guarantees release artefacts are built by the same rustc
      # the workspace is verified against.
      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify toolchain matches rust-toolchain.toml
        run: |
          PINNED=$(awk -F\" '/channel/ { print $2 }' rust-toolchain.toml)
          ACTIVE=$(rustc -V | awk '{ print $2 }')
          if [ "$PINNED" != "$ACTIVE" ]; then
            echo "Toolchain mismatch: rust-toolchain.toml=$PINNED, active=$ACTIVE" >&2
            exit 1
          fi

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build release binary
        run: cross build --release --package toon-mcp-server --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/toon-mcp-server \
             toon-mcp-server-${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: toon-mcp-server-${{ matrix.target }}
          path: toon-mcp-server-${{ matrix.target }}

  build-macos:
    name: Build (aarch64-apple-darwin)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Verify toolchain matches rust-toolchain.toml
        run: |
          PINNED=$(awk -F\" '/channel/ { print $2 }' rust-toolchain.toml)
          ACTIVE=$(rustc -V | awk '{ print $2 }')
          if [ "$PINNED" != "$ACTIVE" ]; then
            echo "Toolchain mismatch: rust-toolchain.toml=$PINNED, active=$ACTIVE" >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --package toon-mcp-server --target aarch64-apple-darwin

      - name: Rename binary
        run: |
          cp target/aarch64-apple-darwin/release/toon-mcp-server \
             toon-mcp-server-aarch64-apple-darwin

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: toon-mcp-server-aarch64-apple-darwin
          path: toon-mcp-server-aarch64-apple-darwin

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/toon-mcp-server-x86_64-unknown-linux-gnu \
            artifacts/toon-mcp-server-aarch64-unknown-linux-gnu \
            artifacts/toon-mcp-server-aarch64-apple-darwin
