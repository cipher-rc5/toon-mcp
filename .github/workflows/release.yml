name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify (fmt / clippy / test / audit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Verify Cargo.lock is up to date (--locked)
        run: cargo check --workspace --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2
        with:
          tool: cargo-audit

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo audit (deny warnings)
        run: cargo audit --deny warnings

  build-linux:
    name: Build (${{ matrix.target }})
    needs: [verify]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Toolchain pinned via rust-toolchain.toml. Keeping this in
      # sync with CI guarantees release artefacts are built by the same rustc
      # the workspace is verified against.
      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify toolchain matches rust-toolchain.toml
        run: |
          PINNED=$(awk -F\" '/channel/ { print $2 }' rust-toolchain.toml)
          ACTIVE=$(rustc -V | awk '{ print $2 }')
          if [ "$PINNED" != "$ACTIVE" ]; then
            echo "Toolchain mismatch: rust-toolchain.toml=$PINNED, active=$ACTIVE" >&2
            exit 1
          fi

      # cargo-zigbuild uses Zig as the cross-linker. This replaces `cross`
      # (which required Docker) and lets us pin the target glibc to 2.17 so
      # the binary loads on RHEL/CentOS 7-era and any newer glibc-based distro.
      - name: Install Zig
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2
        with:
          tool: zig

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2
        with:
          tool: cargo-zigbuild

      - name: Build release binary (glibc 2.17 baseline)
        run: cargo zigbuild --release --package toon-mcp-server --target ${{ matrix.target }}.2.17

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/toon-mcp-server \
             toon-mcp-server-${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toon-mcp-server-${{ matrix.target }}
          path: toon-mcp-server-${{ matrix.target }}

  build-macos:
    name: Build (${{ matrix.target }})
    needs: [verify]
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify toolchain matches rust-toolchain.toml
        run: |
          PINNED=$(awk -F\" '/channel/ { print $2 }' rust-toolchain.toml)
          ACTIVE=$(rustc -V | awk '{ print $2 }')
          if [ "$PINNED" != "$ACTIVE" ]; then
            echo "Toolchain mismatch: rust-toolchain.toml=$PINNED, active=$ACTIVE" >&2
            exit 1
          fi

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --package toon-mcp-server --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/toon-mcp-server \
             toon-mcp-server-${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toon-mcp-server-${{ matrix.target }}
          path: toon-mcp-server-${{ matrix.target }}

  publish-release:
    name: Publish GitHub Release
    needs: [verify, build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install SBOM generator
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx \
            --format json \
            --target all \
            --override-filename toon-mcp-server-sbom
          if [ -f toon-mcp-server-sbom.json ]; then
            mv toon-mcp-server-sbom.json artifacts/toon-mcp-server-sbom.cdx.json
          elif [ -f toon-mcp-server-sbom ]; then
            mv toon-mcp-server-sbom artifacts/toon-mcp-server-sbom.cdx.json
          else
            echo "SBOM generator did not produce toon-mcp-server-sbom(.json)" >&2
            exit 1
          fi

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: |
          sha256sum \
            toon-mcp-server-aarch64-apple-darwin \
            toon-mcp-server-aarch64-unknown-linux-gnu \
            toon-mcp-server-sbom.cdx.json \
            toon-mcp-server-x86_64-apple-darwin \
            toon-mcp-server-x86_64-unknown-linux-gnu \
            > checksums.sha256
          cat checksums.sha256

      - name: Verify release artifact set and checksums
        working-directory: artifacts
        run: |
          test -s toon-mcp-server-x86_64-unknown-linux-gnu
          test -s toon-mcp-server-aarch64-unknown-linux-gnu
          test -s toon-mcp-server-x86_64-apple-darwin
          test -s toon-mcp-server-aarch64-apple-darwin
          test -s toon-mcp-server-sbom.cdx.json
          test -s checksums.sha256
          sha256sum -c checksums.sha256

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release assets with Sigstore keyless
        working-directory: artifacts
        run: |
          for asset in \
            toon-mcp-server-x86_64-unknown-linux-gnu \
            toon-mcp-server-aarch64-unknown-linux-gnu \
            toon-mcp-server-x86_64-apple-darwin \
            toon-mcp-server-aarch64-apple-darwin \
            toon-mcp-server-sbom.cdx.json \
            checksums.sha256; do
            cosign sign-blob --yes \
              --bundle "$asset.sigstore.json" \
              "$asset"
          done

      - name: Generate GitHub artifact attestations
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: artifacts/*

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
